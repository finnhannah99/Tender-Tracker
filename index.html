document.addEventListener('DOMContentLoaded', async function() {

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ius-xl:   20px;  /* feature cards */\n  --radius-2xl:  28px;\n  --radius-pill: 999px; /* tags, CTAs */\n\n  /* ---------- SHADOWS (dark-first → sparse) ---------- */\n  --shadow-inner-hairline: inset 0 0 0 1px rgba(245, 245, 245, 0.08);\n  --shadow-inner-border:   inset 0 0 0 1px rgba(245, 245, 245, 0.16);\n  --shadow-glow-green:     0 0 40px rgba(31, 255, 153, 0.35);\n  --shadow-glow-purple:    0 0 40px rgba(112, 97, 240, 0.35);\n  --shadow-light-sm:       0 1px 2px rgba(31, 31, 31, 0.06);\n  --shadow-light-md:       0 1px 2px rgba(31, 31, 31, 0.06), 0 8px 24px rgba(31, 31, 31, 0.08);\n  --shadow-light-lg:       0 4px 12px rgba(31, 31, 31, 0.08), 0 24px 48px rgba(31, 31, 31, 0.12);\n\n  /* ---------- MOTION ---------- */\n  --ease-ui:   cubic-bezier(0.2, 0.8, 0.2, 1);    /* @kind other */\n  --ease-hero: cubic-bezier(0.65, 0, 0.35, 1);    /* @kind other */\n  --dur-micro:   120ms;   /* @kind other */\n  --dur-standard: 240ms;  /* @kind other */\n  --dur-stage:    480ms;  /* @kind other */\n  --dur-drift:    1200ms;  /* @kind other */\n}\n\n/* =============================================================\n   BASE\n   ============================================================= */\n\nhtml, body {\n  background: var(--color-bg);\n  color: var(--color-fg);\n  font-family: var(--font-body);\n  font-size: var(--font-size-body);\n  line-height: var(--line-height-normal);\n  font-weight: var(--fw-regular);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* =============================================================\n   SEMANTIC TYPE CLASSES — Aeonik (sentence case), mono for labels\n   ============================================================= */\n\n.display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--font-size-display);\n  line-height: var(--line-height-tight);\n  letter-spacing: var(--letter-spacing-display);\n}\n\nh1, .h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--font-size-h1);\n  line-height: var(--line-height-tight);\n  letter-spacing: var(--letter-spacing-display);\n}\n\nh2, .h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--font-size-h2);\n  line-height: var(--line-height-snug);\n  letter-spacing: var(--letter-spacing-tight);\n}\n\nh3, .h3 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--font-size-h3);\n  line-height: var(--line-height-snug);\n  letter-spacing: var(--letter-spacing-tight);\n}\n\nh4, .h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-medium);\n  font-size: var(--font-size-h4);\n  line-height: var(--line-height-snug);\n}\n\nh5, .h5 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-medium);\n  font-size: var(--font-size-h5);\n  line-height: var(--line-height-snug);\n}\n\nh6, .h6 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-medium);\n  font-size: var(--font-size-h6);\n  line-height: var(--line-height-normal);\n}\n\n.body-lg {\n  font-size: var(--font-size-body-lg);\n  line-height: var(--line-height-relaxed);\n}\n\n.body {\n  font-size: var(--font-size-body);\n  line-height: var(--line-height-relaxed);\n}\n\n.body-sm {\n  font-size: var(--font-size-body-sm);\n  line-height: var(--line-height-normal);\n  color: var(--color-fg-2);\n}\n\n.caption {\n  font-size: var(--font-size-caption);\n  line-height: var(--line-height-normal);\n  color: var(--color-fg-3);\n}\n\n.eyebrow {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-medium);\n  font-size: var(--font-size-eyebrow);\n  letter-spacing: var(--letter-spacing-mono);\n  text-transform: uppercase;\n  color: var(--color-fg-2);\n}\n\n.mono {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-regular);\n  letter-spacing: var(--letter-spacing-mono);\n  text-transform: uppercase;\n}\n\ncode, pre, .code {\n  font-family: var(--font-mono);\n  font-size: 0.95em;\n}\n\n<\u002Fstyle>\n  <script src=\"a9c8e977-c5fd-4ec0-a2b0-248ad7305fa6\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: #1F1F1F; }\n    input::placeholder { color: var(--color-neutral-5); }\n    a { color: var(--color-push-green); text-decoration: none; }\n    a:hover { color: var(--color-push-green); text-decoration: underline; text-underline-offset: 4px; }\n    button { font-family: inherit; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-body); padding-bottom: 96px\">\n\n  <header style=\"border-bottom: 1px solid var(--color-border); padding: 24px 32px 0\">\n    <div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap\">\n        <div style=\"display: flex; align-items: center; gap: 20px\">\n          <img src=\"45bd919c-930f-48cf-b7f7-54160f97e92f\" alt=\"Push\" style=\"height: 60px; width: auto; display: block\">\n          <span style=\"width: 1px; height: 24px; background: var(--color-border-hi)\"><\u002Fspan>\n          <span class=\"eyebrow\">// TENDER TRIAGE<\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">{{ sourceLabel }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap\">\n        <div style=\"min-width: 0\">\n          <h1 style=\"font-size: 34px; line-height: 1.1; margin: 0\">Opportunity shortlist<\u002Fh1>\n          <p class=\"body\" style=\"margin: 10px 0 0; max-width: 62ch; color: var(--color-neutral-7)\">Pre-vetted UK public sector notices. Track what we want, clear the rest.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 28px; align-items: flex-end\">\n          <div style=\"text-align: right\">\n            <div class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Awaiting review<\u002Fdiv>\n            <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1.1; color: var(--color-push-green)\">{{ queueCount }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ canFocus }}\">\n            <button sc-camel-on-click=\"{{ enterFocus }}\" style=\"background: var(--color-push-green); color: var(--color-off-black); border: 0; border-radius: 999px; padding: 13px 28px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: box-shadow 240ms cubic-bezier(0.2,0.8,0.2,1)\" style-hover=\"box-shadow: var(--shadow-glow-green)\" style-active=\"transform: scale(0.98)\">Start review<span class=\"mono\" style=\"font-size: 10px; opacity: 0.55\">R<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <nav style=\"display: flex; gap: 4px; align-items: stretch\">\n        <button sc-camel-on-click=\"{{ goQueue }}\" style=\"background: none; border: 0; padding: 0 2px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 14px; align-items: stretch; width: 108px\">\n          <span style=\"display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--color-fg)\">\n            <span style=\"font-size: 15px; font-weight: 500\">Queue<\u002Fspan>\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-2)\">{{ queueCount }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goTracked }}\" style=\"background: none; border: 0; padding: 0 2px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 14px; align-items: stretch; width: 108px\">\n          <span style=\"display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--color-fg)\">\n            <span style=\"font-size: 15px; font-weight: 500\">Tracked<\u002Fspan>\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-2)\">{{ trackedCount }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goCleared }}\" style=\"background: none; border: 0; padding: 0 2px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 14px; align-items: stretch; width: 108px\">\n          <span style=\"display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--color-fg-2)\">\n            <span style=\"font-size: 15px; font-weight: 500\">Cleared<\u002Fspan>\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-3)\">{{ clearedCount }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fnav>\n\n      <div style=\"height: 2px; margin-top: -2px; display: flex\" aria-hidden=\"true\">\n        <div style=\"{{ indicatorStyle }}\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width: 1100px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n\n    <sc-if value=\"{{ showClearedTools }}\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 24px; border-radius: 12px; background: var(--color-bg-lifted); box-shadow: var(--shadow-inner-hairline)\">\n        <span class=\"body-sm\" style=\"margin: 0\">Reasons recorded against irrelevant notices feed the upstream filter.<\u002Fspan>\n        <button sc-camel-on-click=\"{{ exportReasons }}\" style=\"background: none; color: var(--color-fg); border: 1px solid var(--color-border-hi); border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 500; cursor: pointer\" style-hover=\"background: var(--color-bg-hi)\">Export reasons (JSON)<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-for list=\"{{ visible }}\" as=\"item\" hint-placeholder-count=\"4\">\n      <article style=\"background: var(--color-bg-lifted); border-radius: 16px; box-shadow: var(--shadow-inner-hairline); padding: 28px 32px; display: flex; flex-direction: column; gap: 18px\">\n\n        <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\">\n          <span class=\"mono\" style=\"{{ item.statusStyle }}\">{{ item.status }}<\u002Fspan>\n          <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-3)\">{{ item.source }}<\u002Fspan>\n          <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-2)\">{{ item.ref }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <h2 style=\"font-size: 21px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: pretty\">{{ item.title }}<\u002Fh2>\n          <div style=\"font-size: 15px; color: var(--color-neutral-7)\">{{ item.buyer }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 40px; flex-wrap: wrap; padding: 16px 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border)\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Value<\u002Fspan>\n            <span style=\"font-size: 16px; font-weight: 500\">{{ item.valueLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Deadline<\u002Fspan>\n            <span style=\"font-size: 16px; font-weight: 500\">{{ item.deadlineLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Published<\u002Fspan>\n            <span style=\"font-size: 16px; font-weight: 500\">{{ item.publishedLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; margin-left: auto\">\n            <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Notice<\u002Fspan>\n            <a href=\"{{ item.link }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 16px; font-weight: 500\">View source ↗<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 10px; align-items: flex-start\">\n          <p style=\"{{ item.descStyle }}\">{{ item.description }}<\u002Fp>\n          <sc-if value=\"{{ item.canExpand }}\">\n            <button sc-camel-on-click=\"{{ item.toggleExpand }}\" style=\"background: none; border: 0; padding: 0; color: var(--color-push-green); font-size: 13px; font-weight: 500; cursor: pointer; letter-spacing: 0.02em\">{{ item.expandLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ item.clearedNote }}\">\n          <div style=\"display: flex; gap: 10px; align-items: baseline; padding: 14px 18px; border-radius: 8px; background: var(--color-bg); box-shadow: var(--shadow-inner-hairline)\">\n            <span class=\"eyebrow\" style=\"color: var(--color-fg-3); flex: none\">{{ item.clearedKind }}<\u002Fspan>\n            <span class=\"body-sm\" style=\"color: var(--color-neutral-7)\">{{ item.clearedNote }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ item.showQueueActions }}\">\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center\">\n            <button sc-camel-on-click=\"{{ item.track }}\" style=\"background: var(--color-push-green); color: var(--color-off-black); border: 0; border-radius: 999px; padding: 11px 26px; font-size: 14px; font-weight: 700; cursor: pointer; transition: box-shadow 240ms cubic-bezier(0.2,0.8,0.2,1)\" style-hover=\"box-shadow: var(--shadow-glow-green)\" style-active=\"transform: scale(0.98)\">Track<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ item.ignore }}\" style=\"background: none; color: var(--color-fg); border: 1px solid var(--color-border-hi); border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 500; cursor: pointer\" style-hover=\"background: var(--color-bg-hi)\">Ignore<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ item.openReason }}\" style=\"background: none; color: var(--color-fg-2); border: 1px solid var(--color-border); border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 500; cursor: pointer\" style-hover=\"background: var(--color-bg-hi); color: var(--color-fg)\">Irrelevant<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ item.reasonOpen }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px 22px; border-radius: 12px; background: var(--color-bg); box-shadow: var(--shadow-inner-hairline)\">\n            <label class=\"eyebrow\" style=\"color: var(--color-fg-2)\">Why is this irrelevant?<\u002Flabel>\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center\">\n              <input value=\"{{ reasonText }}\" sc-camel-on-change=\"{{ setReason }}\" sc-camel-on-key-down=\"{{ reasonKeyDown }}\" placeholder=\"e.g. Print production only, no media or performance scope\" maxlength=\"120\" autofocus=\"true\" style=\"flex: 1 1 340px; min-width: 0; background: var(--color-bg-lifted); color: var(--color-fg); border: 1px solid var(--color-border-hi); border-radius: 4px; padding: 11px 14px; font-size: 15px; outline: none\" style-focus=\"border-color: var(--color-push-green)\">\n              <button sc-camel-on-click=\"{{ item.confirmIrrelevant }}\" style=\"{{ confirmStyle }}\">Confirm<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ cancelReason }}\" style=\"background: none; color: var(--color-fg-2); border: 0; border-radius: 999px; padding: 10px 14px; font-size: 14px; cursor: pointer\" style-hover=\"color: var(--color-fg)\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n            <span class=\"caption\">One line. This is fed back into the upstream filter, so be specific.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ item.showRestore }}\">\n          <div style=\"display: flex; gap: 10px\">\n            <button sc-camel-on-click=\"{{ item.restore }}\" style=\"background: none; color: var(--color-fg-2); border: 1px solid var(--color-border); border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 500; cursor: pointer\" style-hover=\"background: var(--color-bg-hi); color: var(--color-fg)\">{{ item.restoreLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Farticle>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{ emptyMessage }}\">\n      <div style=\"padding: 72px 32px; border-radius: 16px; box-shadow: var(--shadow-inner-hairline); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center\">\n        <h3 style=\"font-size: 22px; margin: 0\">{{ emptyTitle }}<\u002Fh3>\n        <p class=\"body-sm\" style=\"margin: 0; max-width: 44ch\">{{ emptyMessage }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ focusOn }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 60; background: var(--color-bg); display: flex; flex-direction: column\">\n      <div style=\"padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n        <span class=\"eyebrow\">// REVIEW MODE<\u002Fspan>\n        <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-2)\">{{ focusProgress }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ exitFocus }}\" style=\"background: none; color: var(--color-fg-2); border: 1px solid var(--color-border-hi); border-radius: 999px; padding: 9px 20px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px\" style-hover=\"background: var(--color-bg-hi); color: var(--color-fg)\">Back to list<span class=\"mono\" style=\"font-size: 10px; opacity: 0.6\">ESC<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"height: 2px; background: var(--color-border)\">\n        <div style=\"{{ focusBarStyle }}\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1; overflow-y: auto; padding: 56px 32px 40px\">\n        <sc-if value=\"{{ focus }}\">\n          <div style=\"max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px\">\n            <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <span class=\"mono\" style=\"{{ focus.statusStyle }}\">{{ focus.status }}<\u002Fspan>\n              <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-2)\">{{ focus.source }}<\u002Fspan>\n              <span class=\"mono\" style=\"font-size: 11px; color: var(--color-fg-2)\">{{ focus.ref }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 12px\">\n              <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.12; letter-spacing: -0.02em; margin: 0; text-wrap: pretty\">{{ focus.title }}<\u002Fh2>\n              <div style=\"font-size: 18px; color: var(--color-neutral-7)\">{{ focus.buyer }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; gap: 56px; flex-wrap: wrap; padding: 24px 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border)\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Value<\u002Fspan>\n                <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1\">{{ focus.valueLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Deadline<\u002Fspan>\n                <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1\">{{ focus.deadlineLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span class=\"eyebrow\" style=\"color: var(--color-fg-3)\">Published<\u002Fspan>\n                <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1\">{{ focus.publishedLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 6px; margin-left: auto; justify-content: flex-end\">\n                <a href=\"{{ focus.link }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 16px; font-weight: 500\">View source notice ↗<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: var(--color-neutral-7); max-width: 76ch; text-wrap: pretty; white-space: pre-wrap\">{{ focus.description }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ focusDone }}\">\n          <div style=\"max-width: 560px; margin: 64px auto 0; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center\">\n            <span class=\"eyebrow\" style=\"color: var(--color-push-green)\">// BATCH REVIEWED<\u002Fspan>\n            <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.1; margin: 0\">Queue clear<\u002Fh2>\n            <p class=\"body\" style=\"margin: 0; color: var(--color-neutral-7)\">{{ focusDone }}<\u002Fp>\n            <button sc-camel-on-click=\"{{ exitFocus }}\" style=\"margin-top: 12px; background: var(--color-push-green); color: var(--color-off-black); border: 0; border-radius: 999px; padding: 13px 30px; font-size: 14px; font-weight: 700; cursor: pointer\">Back to list<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ focus }}\">\n        <div style=\"border-top: 1px solid var(--color-border); background: var(--color-bg-lifted); padding: 22px 32px\">\n          <div style=\"max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px\">\n            <sc-if value=\"{{ focusReasonOpen }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <label class=\"eyebrow\" style=\"color: var(--color-fg-2)\">Why is this irrelevant?<\u002Flabel>\n                <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center\">\n                  <input value=\"{{ reasonText }}\" sc-camel-on-change=\"{{ setReason }}\" sc-camel-on-key-down=\"{{ reasonKeyDown }}\" placeholder=\"e.g. Print production only, no media or performance scope\" maxlength=\"120\" autofocus=\"true\" style=\"flex: 1 1 380px; min-width: 0; background: var(--color-bg); color: var(--color-fg); border: 1px solid var(--color-border-hi); border-radius: 4px; padding: 13px 16px; font-size: 15px; outline: none\" style-focus=\"border-color: var(--color-push-green)\">\n                  <button sc-camel-on-click=\"{{ focus.confirmIrrelevant }}\" style=\"{{ confirmStyle }}\">Confirm<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ cancelReason }}\" style=\"background: none; color: var(--color-fg-2); border: 0; padding: 10px 14px; font-size: 14px; cursor: pointer\" style-hover=\"color: var(--color-fg)\">Cancel<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ focusActionsOpen }}\">\n              <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ focus.track }}\" style=\"background: var(--color-push-green); color: var(--color-off-black); border: 0; border-radius: 999px; padding: 13px 30px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: box-shadow 240ms cubic-bezier(0.2,0.8,0.2,1)\" style-hover=\"box-shadow: var(--shadow-glow-green)\" style-active=\"transform: scale(0.98)\">Track<span class=\"mono\" style=\"font-size: 10px; opacity: 0.55\">T<\u002Fspan><\u002Fbutton>\n                <button sc-camel-on-click=\"{{ focus.ignore }}\" style=\"background: none; color: var(--color-fg); border: 1px solid var(--color-border-hi); border-radius: 999px; padding: 12px 26px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px\" style-hover=\"background: var(--color-bg-hi)\">Ignore<span class=\"mono\" style=\"font-size: 10px; color: var(--color-fg-3)\">I<\u002Fspan><\u002Fbutton>\n                <button sc-camel-on-click=\"{{ focus.openReason }}\" style=\"background: none; color: var(--color-fg-2); border: 1px solid var(--color-border); border-radius: 999px; padding: 12px 26px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px\" style-hover=\"background: var(--color-bg-hi); color: var(--color-fg)\">Irrelevant<span class=\"mono\" style=\"font-size: 10px; color: var(--color-fg-3)\">X<\u002Fspan><\u002Fbutton>\n                <div style=\"margin-left: auto; display: flex; gap: 8px; align-items: center\">\n                  <button sc-camel-on-click=\"{{ focusPrev }}\" style=\"background: none; color: var(--color-fg-2); border: 1px solid var(--color-border); border-radius: 999px; width: 40px; height: 40px; font-size: 15px; cursor: pointer\" style-hover=\"background: var(--color-bg-hi); color: var(--color-fg)\">←<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ focusNext }}\" style=\"background: none; color: var(--color-fg-2); border: 1px solid var(--color-border); border-radius: 999px; width: 40px; height: 40px; font-size: 15px; cursor: pointer\" style-hover=\"background: var(--color-bg-hi); color: var(--color-fg)\">→<\u002Fbutton>\n                  <span class=\"mono\" style=\"font-size: 10px; color: var(--color-fg-3); margin-left: 6px\">SKIP<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\">\n    <div style=\"{{ toastStyle }}\">\n      <span style=\"font-size: 14px\">{{ toast }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ undo }}\" style=\"background: none; border: 0; padding: 0; color: var(--color-push-green); font-size: 14px; font-weight: 700; cursor: pointer\">Undo<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sortBy&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;deadline&quot;,&quot;value&quot;,&quot;published&quot;],&quot;default&quot;:&quot;deadline&quot;,&quot;tsType&quot;:&quot;'deadline' | 'value' | 'published'&quot;,&quot;section&quot;:&quot;Queue&quot;},&quot;previewLines&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Queue&quot;},&quot;expandDescriptions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Queue&quot;}}\">\nconst STORE = 'pg-tender-triage-v1';\nconst TENDERS = [{\"id\":\"find-a-tender:078357-2026\",\"status\":\"Closing\",\"title\":\"Communications, Creative and Print Services\",\"buyer\":\"WALSALL HOUSING GROUP LIMITED\",\"description\":\"whg is seeking to appoint suppliers to provide Communications, Creative and Print Services. The procurement is divided into two Lots, with a separate contract to be awarded for each Lot. Suppliers may tender for one or both Lots and may be awarded one or both Lots. Lot 1 - Strategic Creative and Campaign Services whg requires the appointment of a single supplier to act as a strategic communications and creative campaign delivery agency, providing specialist support to the in-house Communications team. The Agency will be expected to deliver insight-led communications and marketing campaigns that achieve measurable outcomes and demonstrate value for money. In addition to campaign delivery, the Agency will act as a strategic partner, providing industry expertise, audience insight, market intelligence and innovative thinking to support whg's longer-term communications objectives. The Agency will be expected to demonstrate a strong understanding of the housing, public and charitable sectors and the ability to engage effectively with a range of stakeholders and key audience groups. Services may include, but are not limited to: • Insight gathering and audience research. • Campaign strategy and planning. • Creative concept development. • Design and creative direction. • Campaign delivery. • Monitoring and reporting. • Post-campaign evaluation. Typical projects may include customer communication campaigns, including service or safety information; recruitment campaigns; organisational change and transformation communications; internal communication and engagement campaigns; and behavioural change campaigns. These examples are illustrative and are not exhaustive. Where campaigns include printed materials, the Lot 1 Agency may develop production-ready artwork and recommend appropriate layouts, formats, paper stocks, finishes and printing techniques. The Agency shall provide approved print-ready artwork and specifications to whg and, where required by whg, support the supplier appointed under Lot 2 to ensure the final printed materials reflect the approved creative concept and brand standards. Lot 2 - Design, Artwork and Promotional Print Services whg requires the appointment of a single supplier to provide design, artwork and promotional print services to support the in-house Communications team. The supplier will deliver high-quality creative assets and digital and printed collateral that support corporate, internal and external communications and whg's organisational priorities. The supplier will be responsible for translating communications objectives and creative briefs into effective visual communications across digital and print channels. Services may include, but are not limited to: • Graphic design, including infographics. • Creative artwork and brand application. • Document, publication and presentation design. • Digital asset creation and social media graphics. • Promotional print production, including merchandise. • Print management and fulfilment. • Event and exhibition printed materials. The appointed supplier shall produce printed materials in accordance with approved artwork and production specifications provided or approved by whg and, where required by whg, shall work collaboratively with the Agency appointed under Lot 1 to ensure high-quality outputs. Interface between the Lots The suppliers appointed to each Lot shall demonstrate the flexibility, capacity and capability to deliver whg's requirements through a seamless and coordinated service offering. Where a requirement involves both Lots, whg may require the suppliers to work collaboratively with each other and with the in-house Communications team. Each supplier shall remain responsible for the quality, performance and delivery of the Services commissioned from it.\",\"value\":null,\"valueBasis\":\"not_stated\",\"deadline\":\"2026-09-15\",\"published\":\"2026-08-18\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/078357-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:081663-2026\",\"status\":\"Closing\",\"title\":\"UK_1498- Arts Content Agency\",\"buyer\":\"British Council\",\"description\":\"The British Council Arts Marketing team is responsible for communicating and telling the story of the British Council’s Arts offers and programmes through digital marketing campaigns and editorial content designed for B2B and B2G audiences, with the aim of improving awareness of, engagement with and advocacy for the British Council’s Arts offers amongst key audiences and stakeholders. The appointed agency will be required to deliver video content production across a range of projects and at various scales to support the output of the British Council Arts Marketing team, with an annual budget of approximately 100k over a period of four years. This is a single supplier contract. Examples of our recent video work can be found on the British Council Arts website and YouTube channel, as well as our social media channels across Instagram, Facebook and X.\",\"value\":null,\"valueBasis\":\"not_stated\",\"deadline\":\"2026-09-21\",\"published\":\"2026-08-27\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/081663-2026\",\"source\":\"Find a Tender\"},{\"id\":\"contracts-finder:deacc37c-ae0b-4309-8955-08124526ad2e-913799\",\"status\":\"Closing\",\"title\":\"RA360283 - Campaign Media Buying (HIV)\",\"buyer\":\"Betsi Cadwaladr University Health Board\",\"description\":\"Wales HIV Testing Week 2026 and PReP Campaign Media Buying Public Health Wales works to protect and improve the sexual health and wellbeing of people in Wales, and to reduce health inequalities. The public health objective is to continue to increase the number of people testing for HIV through a free kit online or through community venues. The communications objectives for Wales HIV Testing Week are to build knowledge about HIV and how to test, increase motivation and encourage relevant audiences to take action and test. The campaign will also build knowledge, public awareness and understanding of PReP and how to access free treatment if you are at-risk of HIV infection. Please see the attached specification for more details and instructions for bidding. All bidders must read the specification in full and upload a proposal as outlined in section 10. Failure to respond in the manner outlined will result in elimination. - To access this competition: login to https://suppliers.multiquote.com and view the opportunity RA360283. Not registered on MultiQuote - visit https://suppliers.multiquote.com then register and quote RA360283 as the reason for registration. Any queries please contact MultiQuote on 0151 482 9230.\",\"value\":null,\"valueBasis\":\"not_stated\",\"deadline\":\"2026-09-21\",\"published\":\"2026-09-11\",\"link\":\"https://www.contractsfinder.service.gov.uk/Notice/deacc37c-ae0b-4309-8955-08124526ad2e\",\"source\":\"Contracts Finder\"},{\"id\":\"find-a-tender:086715-2026\",\"status\":\"Live\",\"title\":\"105017 - What works in AI Adoption within DCMS Sectors\",\"buyer\":\"Department for Culture, Media and Sport\",\"description\":\"DCMS are seeking to commission \\\"what works\\\" research into the impact and effectiveness of AI adoption interventions within DCMS sectors. We are interested in two broad sets of questions. The first is analysis of how businesses within DCMS sectors that are in the process of adopting AI achieve this, the challenges they face and the opportunities and benefits realised. We anticipate this will be explored through an ethnographic study that observes how individuals and teams actually use AI tools in their jobs. The second set of questions is what policy interventions work best to support businesses that wish to adopt AI, which we anticipate will be answered by testing hypothetical interventions through randomised control trials (RCTs). Bidders will be able to propose alternative methodologies if they think they suit these questions better; the core need for this project is to produce direct, robust evidence of what works, as opposed to what is self-reported (e.g. through interviews, focus groups, surveys, and similar) to work. This project will be commissioned either through a Competitive Flexible Procedure under the Procurement Act 2023, or through the RM6126 Research and Insights framework. This is part of the DCMS Science and Analysis R&D Programme, which supports R&D capability within the department. This project will run concurrently aside three other large projects across 2027-2030, these include; mapping the specific \\\"user pathways\\\" audiences take to find, consume, and value information; a continuation of previous research to develop data-intensive approaches for capturing engagement at unticketed cultural, heritage, and sporting events/activities/locations, e.g. using mobile app data to model how people participate in our events; and a continuation of previous research to design and improve methods for holistically tracking the long-term impact of major events, tested on a major event.\",\"value\":1500000,\"valueBasis\":\"published\",\"deadline\":null,\"published\":\"2026-09-14\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/086715-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:086070-2026\",\"status\":\"Live\",\"title\":\"Resourcing the AI Adoption Programme\",\"buyer\":\"Transport for London\",\"description\":\"The GLA Group is exploring the market for an external partner to support the development and delivery of its AI Adoption Programme. The requirement is expected to include developing and embedding common AI principles across the GLA Group, supporting organisational policy and governance, designing and delivering tiered AI training, and supporting the co-design of an operating model and evaluation framework for identifying, piloting and scaling AI opportunities. This preliminary market engagement is intended to help the GLA Group understand market capability, potential delivery approaches, resourcing, indicative costs, timescales and appropriate commercial models ahead of any subsequent procurement. Participation in this exercise does not constitute a call for competition and will not influence any future procurement evaluation.\",\"value\":null,\"valueBasis\":\"not_stated\",\"deadline\":null,\"published\":\"2026-09-10\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/086070-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:083374-2026\",\"status\":\"Live\",\"title\":\"Behaviour Change Agency\",\"buyer\":\"Clarion Housing Group\",\"description\":\"Clarion's marketing strategy focuses on behaviour-change campaigns to support our residents and staff. We expect the supplier to be an expert in behaviour change and to assist Clarion Group with the marketing strategy in this area.\",\"value\":210000,\"valueBasis\":\"published\",\"deadline\":null,\"published\":\"2026-09-03\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/083374-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:079201-2026\",\"status\":\"Live\",\"title\":\"Media Buying Services, Integrated Marketing Campaigns and PR Services\",\"buyer\":\"Llywodraeth Cymru / Welsh Government\",\"description\":\"The Welsh Government Commercial Delivery Team wish to establish a new Framework Agreement for the provision of Media Buying Services, Integrated Marketing Campaigns and PR Services. The Framework Agreement will be open for use by the Welsh Public Sector. The anticipated total Framework value is 82000000 GBP to 49500000GBP. Welsh Government will be holding an engagement event on 8th September 2026. Following the decision to abandon the previous procurement exercise, we are committed to taking time to understand supplier perspectives, lessons learned and opportunities for improvement before progressing a new procurement. Feedback gathered through this engagement will inform decisions on the scope, structure, procurement model and operation of the replacement framework. The precise scope of the Framework Agreement will be provided in the Contract Notice and Tender Documents. Please register to attend the event by midday on 1st September August 2026 via the following link https://wales.business-events.org.uk/en/events/supplier-engagement-for-the-wgcd-media-buying-integrated-marketing-campaigns-and-pr-services-framework-agreement/ where the event details will be provided and where registration will be managed. Those who register will receive confirmation of their registration. Please see the engagement section of this notice for full details.\",\"value\":74000000,\"valueBasis\":\"published\",\"deadline\":null,\"published\":\"2026-08-19\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/079201-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:078957-2026\",\"status\":\"Live\",\"title\":\"Media Buying and Planning\",\"buyer\":\"Transport for Greater Manchester\",\"description\":\"Transport for Greater Manchester (TfGM) is seeking to engage with experienced media planning and buying agencies to inform the development of its procurement strategy and service specification. TfGM anticipates requiring a provider capable of delivering integrated media strategy, planning and buying services, with extensive experience of using strategic insight, audience intelligence and data-driven approaches to develop and deliver effective media campaigns. The successful agency would be expected to support a broad range of transport, behavioural change and customer engagement objectives across Greater Manchester. This market engagement notice will enable TfGM to develop our requirements and inform the tender specification. A Request for Information (RFI) questionnaire is available for suppliers to complete via the Pro Contract portal. Information on how to access the Pro Contract portal and this opportunity can be found further down this notice.\",\"value\":6000000,\"valueBasis\":\"published\",\"deadline\":null,\"published\":\"2026-08-19\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/078957-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:078002-2026\",\"status\":\"Live\",\"title\":\"Digital Adoption Workforce Development Programme\",\"buyer\":\"NHS England\",\"description\":\"Project 1: Change Management Toolkit and Network Estimated budget: approximately £1.5m. The objective is to redesign and maintain the national Change Management Toolkit and operate a national Change Management Network. Project 2: Professional Development Service Estimated budget: approximately £2.5m. The objective is to establish a sustainable, accredited professional development offer that builds Digital Adoption capability across health and care. These may be run as one procurement with lots of two separate ones. The commencement of procurement and award of any subsequent contract will be subject to budgetary approval’\",\"value\":4000000,\"valueBasis\":\"published\",\"deadline\":null,\"published\":\"2026-08-17\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/078002-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:078802-2026\",\"status\":\"Live\",\"title\":\"Performance Marketing Agency\",\"buyer\":\"1\",\"description\":\"this ITT seeks strategic and delivery partners to help Nest build a more mature, always-on marketing capability across Members, Employers and Connectors. The scope spans strategy and business case development, performance marketing, CRM, direct marketing and account-based marketing, supported by specialist ad operations, tracking, attribution and measurement. It covers key direct and digital channels including paid search, organic search, email, paid social, programmatic display and video, content distribution, website optimisation and creative optimisation\",\"value\":4100000,\"valueBasis\":\"published\",\"deadline\":\"2026-09-24\",\"published\":\"2026-08-19\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/078802-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:080475-2026\",\"status\":\"Live\",\"title\":\"C002206 Developing Workforce Digital Confidence and Capability programme\",\"buyer\":\"The Common Services Agency (more commonly known as Public Services Delivery Scotland) (PSD Scotland)\",\"description\":\"Delivery of specialist education and training programmes that support the development of digital confidence and capability across the PSD Scotland workforce. The programmes will provide targeted development in digital, data and artificial intelligence capability and will support staff to use emerging technologies safely, responsibly and effectively within their roles. Lot 1 Applied Digital Applications Fast-Track programme Lot 2 Digital and Artificial Intelligence Support programme Lot 3 Strategic Artificial Intelligence and Digital Leadership programme for executives Lot 4 Artificial Intelligence for Health and Care Practitioners module\",\"value\":null,\"valueBasis\":\"not_stated\",\"deadline\":\"2026-09-25\",\"published\":\"2026-08-24\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/080475-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:083993-2026\",\"status\":\"Live\",\"title\":\"Creative and Content Framework (LSHW.005.2026)\",\"buyer\":\"Life Sciences Hub Wales Limited\",\"description\":\"Life Sciences Hub Wales seeks to procure and implement a Framework Agreement for the provision of Creative and Content Services. In this context, Creative and Content Services are defined as the strategic development, creation, and delivery of high-quality, audience-focused content and creative outputs across multiple channels, formats, and platforms. The services provided via the Creative and Content Services framework will support Life Sciences Hub Wales’s communications, engagement, marketing and brand objectives. Life Sciences Hub Wales requires the strategic development of creative content. Emphasis is placed on strategic; all creative content to be sourced via the framework is to be conceptualised and designed with intention, so that all assets align to, and where appropriate seek to improve or add value to, overarching brand identity, communication plans and campaign effectiveness. There is an overarching strategic wrap-around requirement consistent throughout all framework activity to ensure alignment, consistency and connectivity to wider brand development, content planning and campaign delivery. As such, Life Sciences Hub Wales seeks to appoint suppliers to the Creative and Content Services that have the experience, expertise and vision to design promotional materials, corporate publications, event collateral and multimedia assets with clear conceptual and strategic-alignment, as opposed to standalone designs with no consideration for wider context. The full specification is provided within the Invitation to Tender document further contextualises and defines the Life Sciences Hub Wales requirements and service expectations via the framework. Life Sciences Hub Wales envisages the ad-hoc provision of a range of design material, content and collateral. The nature of the projects and tasks required during the period of the agreement will be varied and dependent on priorities identified by Life Sciences Hub Wales. Each instance of activity as required by Life Sciences Hub Wales will be called-off via the framework as a distinct package of work, in-line with the framework governance process. The intention is to award a position on the framework to up to two (2) suppliers.\",\"value\":75000,\"valueBasis\":\"published\",\"deadline\":\"2026-09-28\",\"published\":\"2026-09-04\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/083993-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:086508-2026\",\"status\":\"Live\",\"title\":\"ITT - Digital and AI Skills Training - UID 321\",\"buyer\":\"Historic England\",\"description\":\"Historic England is seeking an experienced external provider to design, deliver and continuously improve an organisation-wide Digital and AI Capability Programme as part of its AI Adoption workstream. The programme aims to accelerate the responsible adoption of digital and AI technologies by increasing confidence and practical application across the workforce. The successful supplier will help assess current levels of digital and AI maturity, identify skill gaps, provide targeted learning opportunities and support sustainable behavior change. Working closely with the AI Adoption Manager, Learning & Development team and key stakeholders, the supplier will deliver a scalable programme that supports organisational priorities and evolves in response to learner needs and developments in AI technology. Full details can be found in the invitation to tender\",\"value\":180000,\"valueBasis\":\"published\",\"deadline\":\"2026-10-06\",\"published\":\"2026-09-11\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/086508-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:085808-2026\",\"status\":\"Live\",\"title\":\"UK & International Student Recruitment Media Planning & Buying for RGU\",\"buyer\":\"Robert Gordon University\",\"description\":\"Provision of UK & International Student Recruitment Media Planning & Buying for Robert Gordon University.\",\"value\":750000,\"valueBasis\":\"published\",\"deadline\":\"2026-10-14\",\"published\":\"2026-09-10\",\"link\":\"https://www.find-tender.service.gov.uk/Notice/085808-2026\",\"source\":\"Find a Tender\"},{\"id\":\"find-a-tender:081983-2026\",\"status\":\"Unknown\",\"title\":\"Media Buying Services for Guildhall School\",\"buyer\":\"The Mayor and Commonalty and Citizens of the City of London\",\"description\":\"The City invites Bidders to complete and submit a request to participate in the Procurement for the provision of Media Buying Services for the Guildhall School. Guildhall School is where passion meets purpose. We deliver world-class professional training in music, drama, production and design across our iconic, state-of-the-art facilities in the heart of the City of London. The School is seeking an experienced supplier to provide strategic digital media planning and buying services to support the recruitment of students, programme participants and audiences across the full range of   window.addEventListener('keydown', this.onKey);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this.onKey);\n    clearTimeout(this._t);\n  }\n\n  sortQueue() {\n    const d = this.state.decisions;\n    const sortBy = this.props.sortBy || 'deadline';\n    return this.state.records.slice()\n      .filter(r => !d[r.id])\n      .sort((a, b) => {\n        if (sortBy === 'value') return (Number(b.value) || 0) - (Number(a.value) || 0);\n        if (sortBy === 'published') return (b.published || '').localeCompare(a.published || '');\n        if (!a.deadline && !b.deadline) return 0;\n        if (!a.deadline) return 1;\n        if (!b.deadline) return -1;\n        return a.deadline.localeCompare(b.deadline);\n      });\n  }\n\n  onKey = ev => {\n    const s = this.state;\n    const tag = (ev.target.tagName || '').toLowerCase();\n    if (!s.focusOn) {\n      if (tag !== 'input' && (ev.key === 'r' || ev.key === 'R') && s.view === 'queue' && this.sortQueue().length) {\n        ev.preventDefault();\n        this.setState({ focusOn: true, focusIndex: 0 });\n      }\n      return;\n    }\n    if (tag === 'input') return;\n    if (s.reasonId) {\n      if (ev.key === 'Escape') this.setState({ reasonId: null, reasonText: '' });\n      return;\n    }\n    const q = this.sortQueue();\n    const item = q[Math.min(s.focusIndex, q.length - 1)];\n    const k = ev.key;\n    if (k === 'Escape') { ev.preventDefault(); this.setState({ focusOn: false }); return; }\n    if (!item) return;\n    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'j') { ev.preventDefault(); this.step(1); }\n    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'k') { ev.preventDefault(); this.step(-1); }\n    else if (k === 't' || k === 'T') { ev.preventDefault(); this.decide(item.id, 'track'); }\n    else if (k === 'i' || k === 'I') { ev.preventDefault(); this.decide(item.id, 'ignore'); }\n    else if (k === 'x' || k === 'X') { ev.preventDefault(); this.setState({ reasonId: ocusRec = s.focusOn ? queue[focusIdx] : null;\n    const focus = focusRec ? build(focusRec) : null;\n    const reviewed = s.records.length - queue.length;\n\n    const ready = s.records.length > 0;\n    const empties = {\n      queue: ['Queue clear', ready ? 'Every notice in this batch has been reviewed. New opportunities appear here when the finder next runs.' : 'Loading the latest batch of notices.'],\n      tracked: ['Nothing tracked yet', 'Notices you mark as Track from the queue collect here.'],\n      cleared: ['Nothing cleared yet', 'Ignored and irrelevant notices are kept here so decisions stay auditable.']\n    };\n    const e = empties[s.view];\n\n    const indicators = { queue: 0, tracked: 1, cleared: 2 };\n\n    return {\n      sourceLabel: ready ? s.records.length + ' NOTICES IN BATCH' : 'LOADING BATCH',\n      queueCount: queue.length,\n      trackedCount: tracked.length,\n      clearedCount: cleared.length,\n      visible,\n      emptyTitle: e[0],\n      emptyMessage: visible.length === 0 ? e[1] : null,\n      showClearedTools: s.view === 'cleared' && cleared.length > 0,\n      indicatorStyle: 'height: 2px; background: var(--color-push-green); width: 108px; margin-left: ' + (indicators[s.view] * 108) + 'px; transition: margin-left 240ms cubic-bezier(0.2,0.8,0.2,1)',\n      goQueue: () => this.setState({ view: 'queue', reasonId: null }),\n      goTracked: () => this.setState({ view: 'tracked', reasonId: null }),\n      goCleared: () => this.setState({ view: 'cleared', reasonId: null }),\n      reasonText: s.reasonText,\n      setReason: ev => this.setState({ reasonText: ev.target.value }),\n      reasonKeyDown: ev => {\n        if (ev.key === 'Enter' && s.reasonText.trim()) this.decide(s.reasonId, 'irrelevant', s.reasonText.trim());\n        if (ev.key === 'Escape') this.setState({ reasonId: null, reasonText: '' });\n      },\n      cancelReason: () => this.setState({ reasonId: null, reasonText: '' }),\n      confirmStyle: 'border: 0; border-radius: 99
